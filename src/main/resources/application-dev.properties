# --- Dev profile ---
#spring.profiles.active=dev

# DB (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/pdfchat?TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

# OpenAI (read from env; do not commit secrets)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.options.model=gpt-4o-mini

# AWS S3 (dev)
cloud.aws.region.static=us-east-1
app.s3.bucket=pdf-chat-bucket-abhisheksdtu
# Use env vars for credentials; keep bucket private
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.stack.auto=false

# Logging (optional, verbose in dev)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
