# --- Prod profile ---
#spring.profiles.active=prod

# DB (example RDS; adjust)
spring.datasource.url=jdbc:postgresql://YOUR_RDS_ENDPOINT:5432/pdfchat?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# OpenAI (from env/secret manager)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.options.model=gpt-4o-mini

# AWS S3 (prod). Prefer IAM role on the instance/container; omit keys entirely.
cloud.aws.region.static=ap-south-1
app.s3.bucket-name=pdf-chat-bucket-prod
cloud.aws.stack.auto=false
# If using IAM role: DO NOT set cloud.aws.credentials.* in prod
